name: mullet-drivers

x-ros-environment: &ros-environment
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
  RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
  # Same as mullet-core and the paddock: Fast DDS shared memory across host-networked
  # containers discovers topics but drops samples.
  FASTDDS_BUILTIN_TRANSPORTS: ${FASTDDS_BUILTIN_TRANSPORTS:-UDPv4}
  NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
  NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}

services:
  livox:
    profiles: [livox]
    build:
      context: .
      dockerfile: images/livox/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE}
    image: ghcr.io/skymule-ai/mullet-drivers-livox:${LIVOX_IMAGE_TAG:-local}
    network_mode: host
    runtime: nvidia
    environment: *ros-environment
    volumes:
      - ./config/livox:/config:ro

  realsense:
    profiles: [realsense]
    build:
      context: .
      dockerfile: images/realsense/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE}
    image: ghcr.io/skymule-ai/mullet-drivers-realsense:${REALSENSE_IMAGE_TAG:-local}
    network_mode: host
    runtime: nvidia
    environment: *ros-environment
    # librealsense uses the RSUSB backend in this image, so it needs USB access
    # but no host kernel module or broad /dev mount. /dev/bus/usb is mounted rather
    # than passed as a device: the D435i re-enumerates on reset and gets a new node,
    # which a device mapping would not show.
    device_cgroup_rules:
      - "c 189:* rmw"  # USB devices
    volumes:
      - ./config/realsense:/config:ro
      - /dev/bus/usb:/dev/bus/usb
    command:
      - ros2
      - launch
      - realsense2_camera
      - rs_launch.py
      - config_file:=/config/d435i.yaml
      - camera_namespace:=${REALSENSE_CAMERA_NAMESPACE:-uav0}
      - camera_name:=${REALSENSE_CAMERA_NAME:-d435i}
      - tf_prefix:=${REALSENSE_TF_PREFIX:-uav0/d435i}

  viz:
    profiles: [viz]
    build:
      context: .
      dockerfile: images/viz/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE}
    image: ghcr.io/skymule-ai/mullet-drivers-viz:${VIZ_IMAGE_TAG:-local}
    network_mode: host
    runtime: nvidia
    environment:
      <<: *ros-environment
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-all}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

  # Ground-station view without a display on the Orin: Lichtblick or Foxglove on the
  # laptop connects to ws://<drone>:8765.
  foxglove:
    profiles: [foxglove]
    image: ghcr.io/skymule-ai/mullet-drivers-viz:${VIZ_IMAGE_TAG:-local}
    network_mode: host
    environment: *ros-environment
    command:
      - ros2
      - launch
      - foxglove_bridge
      - foxglove_bridge_launch.xml
      - port:=${FOXGLOVE_PORT:-8765}
