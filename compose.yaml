name: mullet_ros_drivers

x-ros-environment: &ros-environment
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
  RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
  NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
  NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}

services:
  livox:
    profiles: [livox]
    build:
      context: .
      dockerfile: images/livox/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE}
    image: ghcr.io/skymule-ai/mullet-ros-livox:${LIVOX_IMAGE_TAG:-local}
    network_mode: host
    runtime: nvidia
    environment: *ros-environment
    volumes:
      - ./config/livox:/config:ro

  realsense:
    profiles: [realsense]
    build:
      context: .
      dockerfile: images/realsense/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE}
    image: ghcr.io/skymule-ai/mullet-ros-realsense:${REALSENSE_IMAGE_TAG:-local}
    network_mode: host
    runtime: nvidia
    environment:
      <<: *ros-environment
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility,graphics}
    # librealsense uses the RSUSB backend in this image, so it needs USB access
    # but no host kernel module or broad /dev mount.
    devices:
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - ./config/realsense:/config:ro
    command:
      - ros2
      - launch
      - realsense2_camera
      - rs_launch.py
      - config_file:=/config/d435i.yaml
      - camera_namespace:=${REALSENSE_CAMERA_NAMESPACE:-uav0}
      - camera_name:=${REALSENSE_CAMERA_NAME:-d435i}
      - tf_prefix:=${REALSENSE_TF_PREFIX:-uav0/d435i}

  viz:
    profiles: [viz]
    build:
      context: .
      dockerfile: images/viz/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE}
    image: ghcr.io/skymule-ai/mullet-ros-viz:${VIZ_IMAGE_TAG:-local}
    network_mode: host
    runtime: nvidia
    environment:
      <<: *ros-environment
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-all}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
