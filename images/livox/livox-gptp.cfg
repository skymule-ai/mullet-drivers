# ptp4l master for the MID-360 over a USB Ethernet adapter (software timestamps, `ptp4l -S`).
# linuxptp's configs/automotive-master.cfg (v4.0): gPTP over L2. Measured on mullet1, 2026-10-19:
# with these settings the MID-360 reports time_sync_type 1 and a few us offset; with plain
# IEEE 1588 over UDP (ptp4l defaults) it answers every Sync but never syncs (time_sync_type 0).
[global]
gmCapable		1
priority1		248
priority2		248
logSyncInterval		-3
syncReceiptTimeout	3
neighborPropDelayThresh	800
min_neighbor_prop_delay	-20000000
assume_two_step		1
path_trace_enabled	1
follow_up_info		1
transportSpecific	0x1
ptp_dst_mac		01:80:C2:00:00:0E
network_transport	L2
delay_mechanism		P2P
BMCA			noop
serverOnly		1
inhibit_announce	1
asCapable		true
inhibit_delay_req	1
